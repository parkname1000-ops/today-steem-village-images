name: Decode Episode Assets

on:
  push:
    branches:
      - main
    paths:
      - "episodes/**/*.png.b64"

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode base64 image files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          decoded=0
          for src in episodes/**/*.png.b64; do
            dest="${src%.b64}"
            base64 --decode "$src" > "$dest"
            file "$dest"
            decoded=1
          done
          if [ "$decoded" -eq 0 ]; then
            echo "No image payloads found."
            exit 1
          fi

      - name: Commit decoded images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes/**/*.png
          if git diff --cached --quiet; then
            echo "No decoded image changes."
            exit 0
          fi
          git commit -m "Decode episode image assets"
          git push
