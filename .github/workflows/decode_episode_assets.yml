name: Decode Episode Assets

on:
  push:
    branches:
      - main
    paths:
      - "episodes/**/*.jpg.b64"
      - ".github/workflows/decode_episode_assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Decode and convert JPEG payloads
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          decoded=0

          for src in episodes/**/*.jpg.b64; do
            echo "변환 중: $src"
            jpg="${src%.b64}"
            png="${jpg%.jpg}.png"

            python - "$src" "$jpg" "$png" <<'PY'
          import base64
          import re
          import sys
          from pathlib import Path
          from PIL import Image, ImageFile

          src, jpg, png = map(Path, sys.argv[1:4])
          raw = src.read_text(encoding="utf-8", errors="ignore")

          # Base64 알파벳 외 문자, 공백, 잘못 들어간 따옴표 등을 제거합니다.
          cleaned = re.sub(r"[^A-Za-z0-9+/=]", "", raw)
          cleaned = cleaned.rstrip("=")
          cleaned += "=" * (-len(cleaned) % 4)

          if len(cleaned) < 100:
              raise SystemExit(f"::error::Base64 데이터가 너무 짧습니다: {src}")

          try:
              data = base64.b64decode(cleaned, validate=False)
          except Exception as exc:
              raise SystemExit(f"::error::Base64 복원 실패: {src}: {exc}")

          if not data.startswith(b"\xff\xd8\xff"):
              raise SystemExit(f"::error::JPEG 시그니처가 없습니다: {src}")

          jpg.write_bytes(data)
          ImageFile.LOAD_TRUNCATED_IMAGES = True

          try:
              with Image.open(jpg) as image:
                  image.load()
                  image = image.convert("RGB")
                  size = (1280, 720) if jpg.name == "cover.jpg" else (720, 900)
                  image = image.resize(size, Image.Resampling.LANCZOS)
                  image.save(png, format="PNG", optimize=True)
          except Exception as exc:
              raise SystemExit(f"::error::JPEG/PIL 검증 실패: {src}: {exc}")

          print(f"복원 완료: {src} -> {png} ({png.stat().st_size} bytes)")
          PY

            file "$png"
            decoded=1
          done

          if [ "$decoded" -eq 0 ]; then
            echo "No JPEG image payloads found."
            exit 1
          fi

      - name: Commit decoded images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes/**/*.png
          if git diff --cached --quiet; then
            echo "No decoded image changes."
            exit 0
          fi
          git commit -m "Decode episode image assets"
          git push
