name: Decode Episode Assets

on:
  push:
    branches:
      - main
    paths:
      - "episodes/**/*.png.b64"
      - "episodes/**/*.png.b64.part*"

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and decode base64 image files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          # 분할 업로드된 *.png.b64.partNN 파일을 순서대로 합칩니다.
          for first_part in episodes/**/*.png.b64.part01; do
            base="${first_part%.part01}"
            cat "${base}".part* > "$base"
          done

          decoded=0
          for src in episodes/**/*.png.b64; do
            dest="${src%.b64}"
            base64 --decode "$src" > "$dest"
            file "$dest"
            decoded=1
          done

          if [ "$decoded" -eq 0 ]; then
            echo "No image payloads found."
            exit 1
          fi

      - name: Commit decoded images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes/**/*.png
          if git diff --cached --quiet; then
            echo "No decoded image changes."
            exit 0
          fi
          git commit -m "Decode episode image assets"
          git push
