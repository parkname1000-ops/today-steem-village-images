name: Decode Episode Assets

on:
  push:
    branches:
      - main
    paths:
      - "episodes/**/*.png.b64"
      - "episodes/**/*.jpg.b64"
      - ".github/workflows/decode_episode_assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Decode and convert image payloads
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          decoded=0

          for src in episodes/**/*.png.b64; do
            dest="${src%.b64}"
            base64 --decode "$src" > "$dest"
            file "$dest"
            decoded=1
          done

          for src in episodes/**/*.jpg.b64; do
            jpg="${src%.b64}"
            png="${jpg%.jpg}.png"
            base64 --decode "$src" > "$jpg"
            python -c 'from PIL import Image; import sys; src=sys.argv[1]; dst=sys.argv[2]; im=Image.open(src).convert("RGB"); size=(1280,720) if src.endswith("cover.jpg") else (720,900); im.resize(size, Image.Resampling.LANCZOS).save(dst, format="PNG", optimize=True)' "$jpg" "$png"
            file "$png"
            decoded=1
          done

          if [ "$decoded" -eq 0 ]; then
            echo "No image payloads found."
            exit 1
          fi

      - name: Commit decoded images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes/**/*.png
          if git diff --cached --quiet; then
            echo "No decoded image changes."
            exit 0
          fi
          git commit -m "Decode episode image assets"
          git push
