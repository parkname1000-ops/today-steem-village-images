name: Decode Episode Assets

on:
  push:
    branches:
      - main
    paths:
      - "episodes/**/*.jpg.b64"
      - ".github/workflows/decode_episode_assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Decode and preserve original resolution
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          decoded=0

          for src in episodes/**/*.jpg.b64; do
            echo "변환 중: $src"
            jpg="${src%.b64}"
            png="${jpg%.jpg}.png"

            python - "$src" "$jpg" "$png" <<'PY'
          import base64
          import re
          import sys
          from pathlib import Path
          from PIL import Image, ImageFile, ImageStat

          src, jpg, png = map(Path, sys.argv[1:4])
          raw = src.read_text(encoding="utf-8", errors="ignore")
          cleaned = re.sub(r"[^A-Za-z0-9+/=]", "", raw).rstrip("=")
          cleaned += "=" * (-len(cleaned) % 4)

          if len(cleaned) < 100:
              raise SystemExit(f"::error::Base64 데이터가 너무 짧습니다: {src}")

          try:
              data = base64.b64decode(cleaned, validate=False)
          except Exception as exc:
              raise SystemExit(f"::error::Base64 복원 실패: {src}: {exc}")

          if not data.startswith(b"\xff\xd8\xff"):
              raise SystemExit(f"::error::JPEG 시그니처가 없습니다: {src}")

          jpg.write_bytes(data)
          ImageFile.LOAD_TRUNCATED_IMAGES = False

          try:
              with Image.open(jpg) as image:
                  image.load()
                  image = image.convert("RGB")
                  width, height = image.size

                  # 원본 해상도를 그대로 유지합니다. 저해상도 파일은 실패 처리합니다.
                  min_width, min_height = ((1600, 900) if jpg.name == "cover.jpg" else (1000, 1400))
                  if width < min_width or height < min_height:
                      raise ValueError(
                          f"해상도 부족: {width}x{height}, 최소 {min_width}x{min_height}"
                      )

                  # 빈 화면·단색 이미지 방지 검사
                  stat = ImageStat.Stat(image.resize((64, 64)))
                  if max(stat.var) < 25:
                      raise ValueError("단색 또는 빈 이미지로 판단됨")

                  image.save(png, format="PNG", optimize=False, compress_level=4)
          except Exception as exc:
              raise SystemExit(f"::error::JPEG/PIL 검증 실패: {src}: {exc}")

          print(
              f"복원 완료: {src} -> {png} "
              f"({width}x{height}, {png.stat().st_size} bytes)"
          )
          PY

            file "$png"
            decoded=1
          done

          if [ "$decoded" -eq 0 ]; then
            echo "No JPEG image payloads found."
            exit 1
          fi

      - name: Commit decoded images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes/**/*.png
          if git diff --cached --quiet; then
            echo "No decoded image changes."
            exit 0
          fi
          git commit -m "Decode high-resolution episode image assets"
          git push
